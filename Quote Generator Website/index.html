<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="quote-box">
        <h2>Quote of the day</h2>
        <blockquote id="quote">Loading...</blockquote>
        <span id="author">Loading...</span>
        <div>
            <button onclick="getQuote(api_url)">New Quote</button>
            <button onclick="tweet()"><img src="twitter.svg.webp">Tweet</button>
        </div>
    </div>
    
    <script>
        const quote = document.getElementById("quote");
        const author = document.getElementById("author");
        const api_url = "https://api.api-ninjas.com/v2/randomquotes";

        async function getQuote(url) {
            const response = await fetch(url, {headers: {"X-Api-Key": "Ilvk2K8KSXv2e7W7PGFJDv1m2mpo0XL2epTPf74u"}});
            var data = await response.json();
            quote.innerHTML = data[0].quote;
            author.innerHTML = data[0].author;
        }
        
        getQuote(api_url);

        function tweet() {
            window.open("https://twitter.com/intent/tweet?text=" + quote.innerHTML + " ---- by: " + author.innerHTML, "Tweet Window", "width=600, height=300");
        }

    </script>
</body>
</html>
